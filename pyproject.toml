[project]
name = "patchproof"
version = "0.1.0"
description = "Claim-scoped executable evidence for Python pull requests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "google-adk>=2,<3",
    "google-auth>=2.40,<3",
    "google-cloud-firestore>=2.21,<3",
    "google-cloud-tasks>=2.19,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.35,<1",
]

[project.scripts]
patchproof = "patchproof.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchproof"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider", "-ra"]
markers = [
    "live_gemini: requires explicit credentials and makes a real Gemini API call",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "benchmarks/hard_mode/fixtures/",
    "benchmarks/hard_mode/oracles/",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
